name: build-apk

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ubuntu-latest 镜像自带 Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk，
      # 含 platforms;android-34 与 build-tools;34.0.0），无需再装 setup-android。
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Point Gradle at preinstalled SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > local.properties
          ls ${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/wxai-debug.apk
          sha256sum out/wxai-debug.apk | tee out/SHA256SUMS.txt
          ls -l out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wxai-debug-apk
          path: out/
          retention-days: 90

      - name: Attach APK to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/wxai-debug.apk
            out/SHA256SUMS.txt
          generate_release_notes: true
